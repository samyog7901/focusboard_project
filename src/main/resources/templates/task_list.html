<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
<div class="container mx-auto px-4 py-8">
  <div class="flex justify-end items-center mb-6 space-x-2">
    <button id="newTaskBtn" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
      <i class="fas fa-plus mr-2"></i> New Task
    </button>
    <button id="logOutBtn" onclick="/login" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
      <i class="fas fa-sign-out-alt mr-2"></i> Log Out
    </button>
  </div>

  <div class="bg-white shadow-md rounded-lg overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created By</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
      </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
      <tr th:each="task : ${tasks}" class="hover:bg-gray-50">
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${task.id}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${task.title}"></td>
        <td class="px-6 py-4 text-sm text-gray-500 max-w-xs truncate" th:text="${task.description}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
          <span th:with="status=${task.status}"
                th:class="${status.getBadgeClass()}"
                th:text="${status.getDisplayText()}"
                class="px-2 py-1 rounded-full text-xs font-semibold">
          </span>
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${task.createdBy}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
          <button th:onclick="'editTask(' + ${task.id} + ')'" class="text-indigo-600 hover:text-indigo-900 mr-3">
            <i class="fas fa-edit"></i>
          </button>
          <button th:onclick="'deleteTask(' + ${task.id} + ')'" class="text-red-600 hover:text-red-900">
            <i class="fas fa-trash-alt"></i>
          </button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Simple Add Task Modal (hidden by default) -->
<div id="taskModal" class="fixed z-10 inset-0 overflow-y-auto hidden">
  <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center">
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"></div>
    <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
      <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
        <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Add New Task</h3>
        <form>
          <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="title">Title</label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="title" type="text">
          </div>
          <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="description">Description</label>
            <textarea class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="description" rows="3"></textarea>
          </div>
          <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="status">Status</label>
            <select class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="status">
              <option value="NOT_STARTED">To Do</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="DONE">Completed</option>
            </select>
          </div>
        </form>
      </div>
      <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
        <button id="saveTask" type="button" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:ml-3 sm:w-auto sm:text-sm">
          Save
        </button>
        <button id="cancelModal" type="button" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const modal = document.getElementById('taskModal');
    const cancelBtn = document.getElementById('cancelModal');
    const newTaskBtn = document.getElementById('newTaskBtn');
    const saveTaskBtn = document.getElementById('saveTask');

    // Show modal when New Task button is clicked
    newTaskBtn.addEventListener('click', function() {
      modal.classList.remove('hidden');
      // Clear form
      document.getElementById('title').value = '';
      document.getElementById('description').value = '';
      document.getElementById('status').value = 'NOT_STARTED';
    });

    // Hide modal when Cancel is clicked
    cancelBtn.addEventListener('click', function() {
      modal.classList.add('hidden');
    });

    // Save task when Save button is clicked
    saveTaskBtn.addEventListener('click', async function() {
      const title = document.getElementById('title').value;
      const description = document.getElementById('description').value;
      const status = document.getElementById('status').value;

      if (!title.trim()) {
        alert('Please enter a task title');
        return;
      }

      try {
        const token = localStorage.getItem('token');
        const response = await fetch('/api/tasks', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': token ? `Bearer ${token}` : ''
          },
          body: JSON.stringify({
            title: title,
            description: description,
            status: status
          })
        });

        if (response.ok) {
          modal.classList.add('hidden');
          // Reload the page to show the new task
          window.location.reload();
        } else {
          const error = await response.json();
          alert('Error creating task: ' + (error.message || 'Unknown error'));
        }
      } catch (error) {
        alert('Network error: ' + error.message);
      }
    });

    // Hide modal when clicking outside
    window.addEventListener('click', function(event) {
      if (event.target === modal) {
        modal.classList.add('hidden');
      }
    });
  });

  document.getElementById("logOutBtn").addEventListener("click", function () {
    // Clear authentication data
    localStorage.removeItem("token");
    localStorage.removeItem("user");

    // Redirect to login page
    window.location.href = "/login"; // Change this if your login page path is different
  });

  // Delete Task (requires admin role)
  function deleteTask(id) {
    if (!confirm("Are you sure you want to delete this task?")) return;

    fetch(`/api/tasks/${id}`, {
      method: 'DELETE',
      headers: {
        'Authorization': `Bearer ${localStorage.getItem('token')}`
      }
    })
            .then(response => {
              if (response.ok) {
                alert("Task deleted.");
                location.reload(); // refresh task list
              } else {
                return response.text().then(text => { throw new Error(text); });
              }
            })
            .catch(err => {
              alert("Error deleting task: " + err.message);
            });
  }

  // Edit Task (show prompt and call PUT)
  function editTask(id) {
    const title = prompt("Enter new title:");
    const description = prompt("Enter new description:");
    const status = prompt("Enter new status (NOT_STARTED, IN_PROGRESS, DONE):");

    const updatedTask = {
      title,
      description,
      status
    };

    fetch(`/api/tasks/${id}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${localStorage.getItem('token')}`
      },
      body: JSON.stringify(updatedTask)
    })
            .then(response => {
              if (response.ok) {
                alert("Task updated.");
                location.reload();
              } else {
                return response.text().then(text => { throw new Error(text); });
              }
            })
            .catch(err => {
              alert("Error updating task: " + err.message);
            });
  }
</script>
</body>
</html>
