<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Login / Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        let isLoginMode = true;

        function toggleMode(login) {
            isLoginMode = login;
            document.getElementById('heading').innerText = isLoginMode ? 'Login' : 'Sign Up';
            document.getElementById('nameField').style.display = isLoginMode ? 'none' : 'block';
            document.getElementById('confirmPassword').style.display = isLoginMode ? 'none' : 'block';
            document.getElementById('forgotPassword').style.display = isLoginMode ? 'block' : 'none';
            document.getElementById('submitBtn').innerText = isLoginMode ? 'Login' : 'Signup';
            document.getElementById('toggleText').innerHTML = isLoginMode
                ? "Don't have an account? <a href='#' class='text-cyan-600 hover:underline' onclick='toggleMode(false)'>Signup now</a>"
                : "Already have an account? <a href='#' class='text-cyan-600 hover:underline' onclick='toggleMode(true)'>Login</a>";

            document.getElementById('indicator').classList.toggle('left-0', isLoginMode);
            document.getElementById('indicator').classList.toggle('left-1/2', !isLoginMode);
        }
    </script>
</head>
<body class="bg-[#498bf5] min-h-screen flex items-center justify-center px-4">

<div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
    <!-- Heading -->
    <h1 id="heading" class="text-3xl font-bold mb-6 text-[#002266] text-center">Login</h1>

    <!-- Tabs -->
    <div class="relative flex h-12 mb-6 border border-gray-300 rounded-full overflow-hidden">
        <button onclick="toggleMode(true)" class="w-1/2 text-lg font-medium z-10 text-white">Login</button>
        <button onclick="toggleMode(false)" class="w-1/2 text-lg font-medium z-10 text-black">Signup</button>
        <div id="indicator" class="absolute top-0 h-full w-1/2 rounded-full bg-gradient-to-r from-blue-700 via-cyan-600 to-cyan-200 transition-all left-0"></div>
    </div>

    <!-- Form -->
    <form class="space-y-4" method="POST" action="/auth">
        <!-- Signup-only field -->
        <input id="nameField" name="name" type="text" placeholder="Name" class="w-full p-3 border-b-2 border-gray-300 outline-none focus:border-cyan-500 placeholder-gray-400 hidden" />

        <!-- Email & Password -->
        <input type="email" name="email" placeholder="Email Address" required class="w-full p-3 border-b-2 border-gray-300 outline-none focus:border-cyan-500 placeholder-gray-400" />
        <input type="password" name="password" placeholder="Password" required class="w-full p-3 border-b-2 border-gray-300 outline-none focus:border-cyan-500 placeholder-gray-400" />

        <!-- Confirm Password -->
        <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm Password" class="w-full p-3 border-b-2 border-gray-300 outline-none focus:border-cyan-500 placeholder-gray-400 hidden" />

        <!-- Forgot Password -->
        <div id="forgotPassword" class="text-right">
            <a href="#" class="text-cyan-600 hover:underline text-sm">Forgot password?</a>
        </div>

        <!-- Submit Button -->
        <button id="submitBtn" type="submit" class="w-full p-3 bg-gradient-to-r from-blue-700 via-cyan-600 to-cyan-200 text-white rounded-full text-lg font-medium hover:opacity-90 transition">
            Login
        </button>

        <!-- Toggle Text -->
        <p id="toggleText" class="text-center text-gray-600 text-sm">
            Don't have an account?
            <a href="#" class="text-cyan-600 hover:underline" onclick="toggleMode(false)">Signup now</a>
        </p>
    </form>
</div>
</body>
</html>
