<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        async function handleForgotPassword(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;

            try {
                // ✅ Updated to port 12000
                const res = await fetch('http://localhost:12000/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();

                if (res.ok) {
                    alert(data.message);
                    // Store email for next step
                    localStorage.setItem('resetEmail', email);
                    window.location.href = "/verify-otp";
                } else {
                    alert(data.error || 'Error occurred');
                }
            } catch (error) {
                alert("Error: " + error.message);
            }
        }
    </script>
</head>
<body class="bg-[#498bf5] flex justify-center items-center min-h-screen px-4">
<div class="bg-white p-6 rounded-2xl shadow-xl max-w-md w-full">
    <h1 class="text-3xl font-bold mb-6 text-center text-[#002266]">Forgot Password</h1>
    <form onsubmit="handleForgotPassword(event)" class="space-y-4">
        <input type="email" id="email" placeholder="Enter your email" required
               class="w-full p-3 border-b-2 border-gray-300 outline-none focus:border-cyan-500" />
        <button type="submit"
                class="w-full bg-gradient-to-r from-blue-700 via-cyan-600 to-cyan-200 text-white rounded-full p-3 font-medium hover:opacity-90">
            Send OTP
        </button>
    </form>
    <div class="text-center mt-4">
        <a href="/login" class="text-blue-600 hover:underline">Back to Login</a>
    </div>
</div>
</body>
</html>
