<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Check if user came from OTP verification
        window.onload = function() {
            const email = localStorage.getItem('resetEmail');
            const otp = localStorage.getItem('verifiedOTP');
            if (!email || !otp) {
                alert('Please complete OTP verification first.');
                window.location.href = '/forgot-password';
                return;
            }
        }

        async function handleResetPassword(event) {
            event.preventDefault();
            const email = localStorage.getItem('resetEmail');
            const otp = localStorage.getItem('verifiedOTP');
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate passwords match
            if (newPassword !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            // Validate password strength
            if (newPassword.length < 6) {
                alert('Password must be at least 6 characters long!');
                return;
            }

            try {
                // ✅ Updated to port 12000
                const res = await fetch('http://localhost:12000/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp, newPassword })
                });

                const data = await res.json();

                if (res.ok) {
                    alert(data.message);
                    // Clear stored data
                    localStorage.removeItem('resetEmail');
                    localStorage.removeItem('verifiedOTP');
                    window.location.href = "/login";
                } else {
                    alert(data.error || 'Error occurred');
                }
            } catch (error) {
                alert("Error: " + error.message);
            }
        }

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const type = field.getAttribute('type') === 'password' ? 'text' : 'password';
            field.setAttribute('type', type);
        }
    </script>
</head>
<body class="bg-[#498bf5] flex justify-center items-center min-h-screen px-4">
<div class="bg-white p-6 rounded-2xl shadow-xl max-w-md w-full">
    <h1 class="text-3xl font-bold mb-6 text-center text-[#002266]">Reset Password</h1>
    <form onsubmit="handleResetPassword(event)" class="space-y-4">
        <div class="relative">
            <input type="password" id="newPassword" placeholder="New Password" required
                   class="w-full p-3 border-b-2 border-gray-300 outline-none focus:border-cyan-500" />
            <button type="button" onclick="togglePassword('newPassword')"
                    class="absolute right-3 top-3 text-gray-500 hover:text-gray-700">
                👁️
            </button>
        </div>
        <div class="relative">
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required
                   class="w-full p-3 border-b-2 border-gray-300 outline-none focus:border-cyan-500" />
            <button type="button" onclick="togglePassword('confirmPassword')"
                    class="absolute right-3 top-3 text-gray-500 hover:text-gray-700">
                👁️
            </button>
        </div>
        <div class="text-sm text-gray-600">
            Password must be at least 6 characters long
        </div>
        <button type="submit"
                class="w-full bg-gradient-to-r from-blue-700 via-cyan-600 to-cyan-200 text-white rounded-full p-3 font-medium hover:opacity-90">
            Reset Password
        </button>
    </form>
    <div class="text-center mt-4">
        <a href="/login" class="text-gray-600 hover:underline">Back to Login</a>
    </div>
</div>
</body>
</html>
